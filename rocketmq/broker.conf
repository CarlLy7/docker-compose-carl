# 集群名称
brokerClusterName = DefaultCluster
# Broker 名称
brokerName = broker-a
# Broker ID, 0 表示 Master
brokerId = 0
# Broker 角色
brokerRole = ASYNC_MASTER
# 刷盘方式
flushDiskType = ASYNC_FLUSH

# 关键配置：Broker 的 IP 地址
# 由于你是通过 Docker Desktop 在 Windows 上运行，客户端（如你的 Java 程序）需要能访问到这个 IP。
# 如果客户端也在 Docker 容器中，可以使用服务名 'broker'。
# 如果客户端在宿主机（你的 Windows 系统）上，则需要填写你电脑的局域网 IP（如 192.168.x.x），不能是 127.0.0.1！
brokerIP1 = host.docker.internal
listenPort = 10911
# 自动创建 Topic，便于开发测试
autoCreateTopicEnable = false
